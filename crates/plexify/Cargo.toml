[package]
name = "plexify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight native Plex music player"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "plexify"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
# CPU rasterizer for egui (egui_software_backend ported to egui 0.37).
egui_software_backend = { package = "hdrshot-egui-backend", version = "0.2" }
dirs = "7"
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
urlencoding = "2"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.40", features = ["bundled"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "aac", "alac", "isomp4", "ogg", "vorbis", "wav", "pcm"] }
rubato = "0.16"
rtrb = "0.3"

[target.'cfg(not(windows))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "x11"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
mockplex = { path = "../mockplex" }

[build-dependencies]
winresource = "0.1"
