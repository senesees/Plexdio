[package]
name = "plexify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight native Plex music player"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "plexify"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
# CPU rasterizer for egui (egui_software_backend ported to egui 0.37).
egui_software_backend = { package = "hdrshot-egui-backend", version = "0.2" }
dirs = "7"
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"

[target.'cfg(not(windows))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
winresource = "0.1"
