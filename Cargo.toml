[workspace]
resolver = "2"
members = ["crates/plexdio", "crates/mockplex"]
default-members = ["crates/plexdio", "crates/mockplex"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# Fast-to-build profile for iterating under Wine.
[profile.dev-opt]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true

