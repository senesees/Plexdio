[workspace]
resolver = "2"
members = ["crates/plexdio", "crates/mockplex"]
default-members = ["crates/plexdio", "crates/mockplex"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# Ride's beat model (rten, see assets/models/README.md) needs real optimisation: the rest of the
# app is size-optimised, which makes neural-network inference several times slower.
[profile.release.package.rten]
opt-level = 3

[profile.release.package.rten-base]
opt-level = 3

[profile.release.package.rten-gemm]
opt-level = 3

[profile.release.package.rten-simd]
opt-level = 3

[profile.release.package.rten-tensor]
opt-level = 3

[profile.release.package.rten-vecmath]
opt-level = 3

[profile.release.package.rten-model-file]
opt-level = 3

[profile.release.package.rten-onnx]
opt-level = 3

[profile.release.package.rten-shape-inference]
opt-level = 3

[profile.release.package.beat-this]
opt-level = 3

# Fast-to-build profile for iterating under Wine.
[profile.dev-opt]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true

